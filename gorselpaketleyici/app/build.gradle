plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atmaca.gorselpaketleyici.v2'
    compileSdk 36

    defaultConfig {
        applicationId 'com.atmaca.gorselpaketleyici.v2'
        minSdk 23
        targetSdk 36
        versionCode 20
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
