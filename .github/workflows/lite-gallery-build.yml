name: Build Lite Gallery
on:
  push:
    branches: [ lite-gallery-build ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and Build APK
        working-directory: gallery
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Hafif-Galeri-APK
          path: gallery/app/build/outputs/apk/debug/app-debug.apk
