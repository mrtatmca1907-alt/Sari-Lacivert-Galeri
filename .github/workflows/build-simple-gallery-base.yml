name: Build BestGallery Base APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-simple-gallery-base.yml'
      - 'bestgallery/**'

jobs:
  build-bestgallery:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Bu repoyu al
        uses: actions/checkout@v5

      - name: SDK icin Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: API 28 kur
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Eski Gradle icin Java 8 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: BestGallery kaynagini al
        run: git clone --depth 1 https://github.com/JustinBeeper/BestGallery.git bestgallery-upstream

      - name: Sarı lacivert tasarım, ikon ve reklamsız yamaları uygula
        working-directory: bestgallery-upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace('applicationId "com.eagle.gallery.photos.videos.album.hd.gallery.editor"', 'applicationId "com.sarilacivert.bestgallery"')

          for dep in [
              "implementation 'com.tencent.bugly:crashreport:2.3.1'",
              "implementation 'com.google.firebase:firebase-core:16.0.0'",
              "implementation 'com.google.firebase:firebase-config:16.0.0'",
              "implementation \"com.google.android.gms:play-services-ads:15.0.1\"",
          ]:
              s = s.replace(dep, '')

          s = s.replace("implementation 'com.google.vr:sdk-panowidget:1.180.0'", '')
          s = s.replace("implementation 'com.google.vr:sdk-videowidget:1.180.0'", '')
          if "implementation fileTree(dir: 'libs', include: ['*.aar'])" not in s:
              s = s.replace('dependencies {', "dependencies {\n    implementation fileTree(dir: 'libs', include: ['*.aar'])\n    implementation 'com.google.protobuf.nano:protobuf-javanano:3.1.0'")
          p.write_text(s)

          # Uygulama adı.
          strings = Path('app/src/main/res/values/strings.xml')
          t = strings.read_text()
          t = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Sarı Lacivert Galeri</string>', t, count=1)
          t = re.sub(r'<string name="app_launcher_name">.*?</string>', '<string name="app_launcher_name">Sarı Lacivert Galeri</string>', t, count=1)
          strings.write_text(t)

          # BestGallery'nin kendi tema mekanizmasının varsayılanlarını sarı-lacivert yap.
          colors = Path('commons/src/main/res/values/colors.xml')
          c = colors.read_text()
          replacements = {
              '<color name="color_primary">#ff5c1166</color>': '<color name="color_primary">#0B1D3A</color>',
              '<color name="color_primary_dark">#ff5c1166</color>': '<color name="color_primary_dark">#061326</color>',
              '<color name="color_accent">@color/color_primary</color>': '<color name="color_accent">#F4C430</color>',
              '<color name="default_text_color">@color/theme_dark_text_color</color>': '<color name="default_text_color">#FFF7D6</color>',
              '<color name="default_background_color">@color/theme_dark_background_color</color>': '<color name="default_background_color">#081426</color>',
              '<color name="default_background_color2">#202340</color>': '<color name="default_background_color2">#0D1B2E</color>',
          }
          for old, new in replacements.items():
              c = c.replace(old, new)
          colors.write_text(c)

          app_colors = Path('app/src/main/res/values/colors.xml')
          ac = app_colors.read_text().replace('<color name="actionbar_menu_icon">#454545</color>', '<color name="actionbar_menu_icon">#F4C430</color>')
          app_colors.write_text(ac)

          # İlk kurulumda veya önceki test APK'sının üstüne kurulunca eski mor tema kalmasın.
          app = Path('app/src/main/kotlin/com/eagle/gallery/pro/App.kt')
          a = app.read_text()
          a = a.replace('import com.google.firebase.FirebaseApp\n', '')
          a = re.sub(r'\n\s*Thread \{\s*FirebaseApp\.initializeApp\(this\)\s*\}\.start\(\)\s*\n', '\n', a, flags=re.S)
          if 'import com.eagle.commons.helpers.BaseConfig' not in a:
              a = a.replace('import com.eagle.commons.extensions.checkUseEnglish\n', 'import com.eagle.commons.extensions.checkUseEnglish\nimport com.eagle.commons.helpers.BaseConfig\n')
          branding = '''\n        val brandingPrefs = getSharedPreferences("sari_lacivert_branding", Context.MODE_PRIVATE)\n        if (!brandingPrefs.getBoolean("theme_v2", false)) {\n            val config = BaseConfig.newInstance(this)\n            val primary = resources.getColor(R.color.color_primary)\n            val background = resources.getColor(R.color.default_background_color2)\n            val text = resources.getColor(R.color.default_text_color)\n            config.primaryColor = primary\n            config.backgroundColor = background\n            config.textColor = text\n            config.customPrimaryColor = primary\n            config.customBackgroundColor = background\n            config.customTextColor = text\n            config.appIconColor = primary\n            brandingPrefs.edit().putBoolean("theme_v2", true).apply()\n        }\n'''
          a = a.replace('        mContext = applicationContext\n', '        mContext = applicationContext\n' + branding, 1)
          app.write_text(a)

          # Yeni launcher ikonu: lacivert zemin + sarı galeri simgesi.
          icon = Path('app/src/main/res/drawable/ic_sari_lacivert_gallery.xml')
          icon.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="108dp" android:height="108dp"\n    android:viewportWidth="108" android:viewportHeight="108">\n    <path android:fillColor="#081426" android:pathData="M0,0H108V108H0Z"/>\n    <path android:fillColor="#F4C430" android:pathData="M14,18H94V90H14Z"/>\n    <path android:fillColor="#081426" android:pathData="M21,25H87V83H21Z"/>\n    <path android:fillColor="#F4C430" android:pathData="M68,37a8,8 0,1 0,16,0a8,8 0,1 0,-16,0"/>\n    <path android:fillColor="#F4C430" android:pathData="M24,77L43,55L56,68L66,58L84,77Z"/>\n</vector>\n''')

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = m.replace('@mipmap/ic_launcher', '@drawable/ic_sari_lacivert_gallery')
          m = re.sub(r'\s*<meta-data\s+android:name="com\.google\.android\.gms\.version"\s+android:value="@integer/google_play_services_version"\s*/>', '', m, flags=re.S)
          m = re.sub(r'\s*<activity\s+android:name="com\.google\.android\.gms\.ads\.AdActivity".*?/>', '', m, flags=re.S)
          manifest.write_text(m)

          root = Path('build.gradle')
          r = root.read_text()
          marker = 'maven { url "https://jitpack.io" }'
          if 'artifactory.appodeal.com/appodeal-public' not in r:
              r = r.replace(marker, marker + '\n        maven { url "https://artifactory.appodeal.com/appodeal-public" }\n        maven { url "https://maven.aliyun.com/repository/jcenter" }')
          root.write_text(r)
          PY

          mkdir -p app/libs
          BASE="https://raw.githubusercontent.com/googlevr/gvr-android-sdk/25a0c20415bd3854b76f3e0e55f73d36cdc076fd/libraries"
          curl -L --fail "$BASE/sdk-common-1.180.0.aar" -o app/libs/sdk-common-1.180.0.aar
          curl -L --fail "$BASE/sdk-commonwidget-1.180.0.aar" -o app/libs/sdk-commonwidget-1.180.0.aar
          curl -L --fail "$BASE/sdk-panowidget-1.180.0.aar" -o app/libs/sdk-panowidget-1.180.0.aar
          curl -L --fail "$BASE/sdk-videowidget-1.180.0.aar" -o app/libs/sdk-videowidget-1.180.0.aar

      - name: Debug APK derle
        working-directory: bestgallery-upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: Sari-Lacivert-Galeri-BestGallery-V2-APK
          path: bestgallery-upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
