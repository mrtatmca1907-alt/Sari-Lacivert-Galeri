name: Patch ATMACA Cloud HDD

on:
  push:
    branches: ["atmaca-offline-sync-impl"]
    paths:
      - ".github/workflows/patch-atmaca-cloud-hdd.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atmaca-offline-sync-impl
      - name: Patch MainActivity
        run: python tools/patch_atmaca_cloud_hdd.py
      - name: Commit Cloud HDD recovery flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ATMACA-WIFI/app/src/main/java/com/atmaca/files/MainActivity.java
          git commit -m "feat: recover cloud backups through phone to HDD"
          git push origin HEAD:atmaca-offline-sync-impl
