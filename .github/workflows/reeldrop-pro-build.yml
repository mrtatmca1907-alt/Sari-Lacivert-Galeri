name: Build ReelDrop Pro
on:
  push:
    branches: [ reeldrop-pro ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and Build APK
        working-directory: reeldroppro
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReelDrop-Pro-APK
          path: reeldroppro/app/build/outputs/apk/debug/app-debug.apk
