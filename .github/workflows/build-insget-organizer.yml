name: Build Insget Organizer APK

on:
  push:
    branches:
      - insget-organizer
    paths:
      - 'InsgetOrganizer/**'
      - '.github/workflows/build-insget-organizer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test and build debug APK
        working-directory: InsgetOrganizer
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Insget-Organizer-APK
          path: InsgetOrganizer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
