name: Apply Stable Photo Fix
on:
  push:
    branches: [atmaca-native-core]
    paths: ['.github/workflows/apply-stable-photo-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: atmaca-native-core
      - name: Patch stable viewer and album loading
        shell: python
        run: |
          from pathlib import Path

          p = Path('coreapp/src/main/kotlin/com/atmaca/gallery/GalleryApp.kt')
          s = p.read_text()

          old = '''    val rotations = remember { mutableStateMapOf<Long, Float>() }\n    var controlsVisible by remember { mutableStateOf(true) }'''
          new = '''    val rotations = remember { mutableStateMapOf<Long, Float>() }\n    val zooms = remember { mutableStateMapOf<Long, Float>() }\n    var gestureActive by remember { mutableStateOf(false) }\n    var controlsVisible by remember { mutableStateOf(true) }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    Box(\n        Modifier\n            .fillMaxSize()\n            .background(Color.Black)\n            .pointerInput(Unit) {\n                detectTapGestures(onTap = { controlsVisible = !controlsVisible })\n            }\n    ) {\n        HorizontalPager(state = pager, modifier = Modifier.fillMaxSize()) { page ->\n            val item = items[page]\n            val rotation = rotations[item.id] ?: 0f\n            if (item.isVideo) VideoPage(item, rotation) else PhotoPage(item, rotation)\n        }\n\n        if (controlsVisible) {'''
          new = '''    val currentItem = items.getOrNull(pager.currentPage)\n    val currentScale = currentItem?.let { zooms[it.id] } ?: 1f\n\n    Box(\n        Modifier\n            .fillMaxSize()\n            .background(Color.Black)\n    ) {\n        HorizontalPager(\n            state = pager,\n            userScrollEnabled = shouldEnablePager(currentScale),\n            modifier = Modifier.fillMaxSize()\n        ) { page ->\n            val item = items[page]\n            val rotation = rotations[item.id] ?: 0f\n            if (item.isVideo) {\n                VideoPage(item, rotation)\n            } else {\n                StablePhotoPage(\n                    item = item,\n                    rotation = rotation,\n                    onScaleChanged = { zooms[item.id] = it },\n                    onGestureActive = { gestureActive = it },\n                    onFitTap = { controlsVisible = !controlsVisible }\n                )\n            }\n        }\n\n        if (controlsVisible && shouldShowViewerControls(currentScale, gestureActive)) {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                    IconButton(onClick = {\n                        rotations[current.id] = nextQuarterRotation(rotations[current.id] ?: 0f)\n                    }) { Icon(Icons.Default.RotateRight, "90 derece döndür", tint = Color.White) }'''
          new = '''                    IconButton(onClick = {\n                        zooms[current.id] = 1f\n                        gestureActive = false\n                        rotations[current.id] = nextQuarterRotation(rotations[current.id] ?: 0f)\n                    }) {\n                        Column(horizontalAlignment = Alignment.CenterHorizontally) {\n                            Icon(Icons.Default.RotateRight, "90 derece döndür", tint = Color.White)\n                            Text("Döndür", color = Color.White, style = MaterialTheme.typography.labelSmall)\n                        }\n                    }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                            albums = albums,\n                            onOpen = { album -> vm.openAlbum(album.relativePath) }'''
          new = '''                            albums = if (albums.isNotEmpty()) albums else quickAlbums(state.items),\n                            onOpen = { album -> vm.openAlbum(album.relativePath) }'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          r = Path('coreapp/src/main/kotlin/com/atmaca/gallery/MediaStoreRepository.kt')
          rs = r.read_text()
          old = '''            while (cursor.moveToNext()) {\n                coroutineContext.ensureActive()\n                val item = cols.read(cursor)\n                val path = normalizeRelativePath(item.relativePath)\n                counts[path] = (counts[path] ?: 0) + 1\n                if (path !in covers) covers[path] = item\n            }'''
          new = '''            while (cursor.moveToNext()) {\n                coroutineContext.ensureActive()\n                val path = normalizeRelativePath(cols.readRelativePath(cursor))\n                counts[path] = (counts[path] ?: 0) + 1\n                if (path !in covers) covers[path] = cols.read(cursor)\n            }'''
          assert old in rs
          rs = rs.replace(old, new, 1)

          old = '''        fun read(cursor: android.database.Cursor): GalleryMedia {'''
          new = '''        fun readRelativePath(cursor: android.database.Cursor): String =\n            if (relativePath >= 0) cursor.getString(relativePath) ?: "" else ""\n\n        fun read(cursor: android.database.Cursor): GalleryMedia {'''
          assert old in rs
          rs = rs.replace(old, new, 1)
          r.write_text(rs)

          b = Path('coreapp/build.gradle.kts')
          bs = b.read_text()
          bs = bs.replace('versionCode = 3', 'versionCode = 4').replace('versionName = "0.3.0-viewer"', 'versionName = "0.4.0-stable-photo"')
          b.write_text(bs)

          Path('.github/workflows/apply-stable-photo-fix.yml').unlink()
      - name: Commit stable fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize photo zoom swipe rotation and albums"
          git push origin HEAD:atmaca-native-core
