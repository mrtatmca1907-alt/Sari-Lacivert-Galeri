name: Build ATMACA Native Core

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'coreapp/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-atmaca-core.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch for one-time settings migration
        uses: actions/checkout@v5
        with:
          ref: atmaca-native-core

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Migrate modern settings into direct source
        run: python3 coreapp/migrate_modern_settings_once.py

      - name: Commit migrated GalleryApp source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coreapp/src/main/kotlin/com/atmaca/gallery/GalleryApp.kt
          git commit -m "refactor: wire modern settings panel into GalleryApp source"
          git push origin HEAD:atmaca-native-core

      - name: Unit tests
        run: gradle :coreapp:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :coreapp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Galeri-Core-APK
          path: coreapp/build/outputs/apk/debug/coreapp-debug.apk
          if-no-files-found: error
