name: Build ATMACA Native Core

on:
  workflow_dispatch:
  push:
    branches:
      - fix/coreapp-140904-media-tools
    paths:
      - 'coreapp/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-atmaca-core.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'coreapp/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-atmaca-core.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply runtime gallery fixes
        run: python3 coreapp/apply_runtime_fixes.py

      - name: Apply OEM album retry
        run: python3 coreapp/apply_album_oem_retry.py

      - name: Apply viewer paging fix
        run: python3 coreapp/apply_viewer_paging_fix.py

      - name: Apply pull-down refresh
        run: python3 coreapp/apply_pull_refresh.py

      - name: Apply viewer chrome
        run: python3 coreapp/apply_viewer_chrome.py

      - name: Verify direct gallery source
        run: python3 coreapp/check_direct_source.py

      - name: Unit tests
        run: gradle :coreapp:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :coreapp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Galeri-Core-APK
          path: coreapp/build/outputs/apk/debug/coreapp-debug.apk
          if-no-files-found: error
