name: Build ATMACA Native Core

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'coreapp/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-atmaca-core.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply complete gallery home patch
        run: python3 coreapp/patch_complete_gallery.py

      - name: Wire complete tools and bulk features
        run: python3 coreapp/patch_complete_features.py

      - name: Apply advanced media settings
        run: python3 coreapp/patch_advanced_media_settings.py

      - name: Apply stable photo performance patch
        run: python3 coreapp/patch_stable_photo_perf.py

      - name: Apply stable Eagle viewer patch
        run: python3 coreapp/patch_eagle_viewer.py

      - name: Unit tests
        run: gradle :coreapp:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :coreapp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Galeri-Core-APK
          path: coreapp/build/outputs/apk/debug/coreapp-debug.apk
          if-no-files-found: error
