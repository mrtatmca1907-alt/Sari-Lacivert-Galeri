name: Apply ATMACA Photo Tools v0.5

on:
  push:
    branches:
      - atmaca-native-core
    paths:
      - .github/workflows/apply-photo-tools-v05.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: atmaca-native-core
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_photo_tools_v05.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add photo tools screenshot and free rotation"
          git push origin HEAD:atmaca-native-core
