name: Build VideoKareleri V5 Kotlin

on:
  push:
    branches: [ video-kareleri-v5-kotlin ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: vk5
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VideoKareleri-V5-Kotlin-APK
          path: vk5/app/build/outputs/apk/debug/app-debug.apk
