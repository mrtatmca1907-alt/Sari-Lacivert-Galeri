name: Build ATMACA Windows EXE

on:
  push:
    paths:
      - "windows-photo-tool/**"
      - ".github/workflows/build-windows-photo-tool.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ATMACA_Gorsel_Yoneticisi windows-photo-tool/atmacagorsel.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Gorsel-Yoneticisi-Windows
          path: dist/ATMACA_Gorsel_Yoneticisi.exe
          if-no-files-found: error
