name: ATMACA Canli Dublaj APK
on:
  push:
    branches: [atmaca-canli-dublaj]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p CanliDublaj assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Canli-Dublaj-test-APK
          path: CanliDublaj/app/build/outputs/apk/debug/*.apk