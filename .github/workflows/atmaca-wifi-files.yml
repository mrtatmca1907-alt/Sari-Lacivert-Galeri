name: ATMACA WiFi Files APK

on:
  push:
    branches: ["atmaca-wifi-files"]
    paths:
      - "ATMACA-WIFI/**"
      - ".github/workflows/atmaca-wifi-files.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ATMACA-WIFI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ATMACA-Dosya-Yoneticisi-WIFI.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Dosya-Yoneticisi-WIFI
          path: ATMACA-WIFI/ATMACA-Dosya-Yoneticisi-WIFI.apk
          if-no-files-found: error
