name: ATMACA Video50 APK

on:
  push:
    branches: ["video50-organizer"]
    paths:
      - "VIDEO50/**"
      - ".github/workflows/video50-organizer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VIDEO50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ATMACA-Video50.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Video50
          path: VIDEO50/ATMACA-Video50.apk
          if-no-files-found: error
