name: Eagle Viewer TDD

on:
  push:
    branches: [atmaca-native-core]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply Eagle viewer source patch
        run: python3 coreapp/patch_eagle_viewer.py
      - name: Unit tests
        run: gradle :coreapp:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :coreapp:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Galeri-v0.5.3-Eagle-Viewer
          path: coreapp/build/outputs/apk/debug/coreapp-debug.apk
          if-no-files-found: error
