name: Patch ATMACA Movies Backup

on:
  push:
    branches: ["atmaca-offline-sync-impl"]
    paths:
      - ".github/workflows/patch-atmaca-movies.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atmaca-offline-sync-impl
      - name: Patch MainActivity
        run: python tools/patch_atmaca_movies.py
      - name: Commit Movies backup UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ATMACA-WIFI/app/src/main/java/com/atmaca/files/MainActivity.java
          git commit -m "feat: back up Movies directly to remembered cloud target"
          git push origin HEAD:atmaca-offline-sync-impl
