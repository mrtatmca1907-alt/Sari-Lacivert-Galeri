name: Apply OEM Gallery Fix

on:
  push:
    branches: [ atmaca-native-core ]
    paths:
      - 'coreapp/apply_oem_gallery_fix.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: atmaca-native-core
      - name: Apply source migration
        run: python3 coreapp/apply_oem_gallery_fix.py
      - name: Commit migration
        run: |
          git config user.name "atmaca-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add coreapp/src/main/kotlin/com/atmaca/gallery/FeatureRules.kt coreapp/src/main/kotlin/com/atmaca/gallery/CompleteSettingsExtras.kt coreapp/src/main/kotlin/com/atmaca/gallery/GalleryApp.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: OEM albums internal picker and drag selection"
          git push origin HEAD:atmaca-native-core
