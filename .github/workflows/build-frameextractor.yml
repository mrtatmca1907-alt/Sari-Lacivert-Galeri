name: Build ATMACA Kare Cikarici APK
on:
  push:
    branches: [feature/frameextractor-50]
    paths: ['frameextractor/**', '.github/workflows/build-frameextractor.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --stacktrace
        working-directory: frameextractor
      - uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Kare-Cikarici-50-APK
          path: frameextractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
