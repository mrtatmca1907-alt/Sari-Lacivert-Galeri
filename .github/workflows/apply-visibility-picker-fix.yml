name: Apply Visibility Picker Fix

on:
  push:
    branches: [ atmaca-native-core ]
    paths:
      - 'coreapp/apply_visibility_picker_fix.py'
      - '.github/workflows/apply-visibility-picker-fix.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: atmaca-native-core
      - name: Apply source migration
        run: python3 coreapp/apply_visibility_picker_fix.py
      - name: Commit migration
        run: |
          git config user.name "atmaca-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add coreapp/src/main/kotlin/com/atmaca/gallery/MediaStoreRepository.kt coreapp/src/main/kotlin/com/atmaca/gallery/InternalToolAlbumPicker.kt coreapp/src/main/kotlin/com/atmaca/gallery/VideoFrameWorker.kt coreapp/src/main/kotlin/com/atmaca/gallery/GalleryApp.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: media visibility screenshot source and frame progress"
          git push origin HEAD:atmaca-native-core
