name: Build ATMACA Gorsel Paketleyici APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ATMACA-Gorsel-Paketleyici/**'
      - '.github/workflows/build-atmaca-paketleyici.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: ATMACA-Gorsel-Paketleyici
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Gorsel-Paketleyici-APK
          path: ATMACA-Gorsel-Paketleyici/app/build/outputs/apk/debug/app-debug.apk
