name: Build ATMACA 1907 APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/imagemover-1907
    paths:
      - 'imagemover/**'
      - '.github/workflows/build-imagemover.yml'

concurrency:
  group: imagemover-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: API 35 hazirla
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Gradle 8.10.2 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test ve APK derle
        working-directory: imagemover
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: APK adini duzelt
        run: cp imagemover/app/build/outputs/apk/debug/app-debug.apk imagemover/ATMACA-1907.apk

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-1907-APK
          path: imagemover/ATMACA-1907.apk
          if-no-files-found: error
          retention-days: 30
