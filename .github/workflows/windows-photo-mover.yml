name: Windows Photo Mover
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-photo-mover.yml'
      - 'windows-photo-mover/**'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build GUI EXE
        run: dotnet publish windows-photo-mover/PhotoMover.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o output
      - uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Fotograf-Tasiyici
          path: output/ATMACA-Fotograf-Tasiyici.exe
