name: Build Sari Lacivert Galeri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug APK derle
        run: gradle :app:assembleDebug --stacktrace

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: Sari-Lacivert-Galeri-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
