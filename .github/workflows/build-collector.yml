name: ATMACA Photo Collector APK
on:
  pull_request:
    paths:
      - 'tools/collector-source.b64'
      - '.github/workflows/build-collector.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore standalone source
        run: |
          mkdir -p tools/ATMACA-Gorsel-Toplayici
          base64 -d tools/collector-source.b64 > /tmp/collector-source.zip
          unzip -q /tmp/collector-source.zip -d tools/ATMACA-Gorsel-Toplayici
      - name: Build standalone APK
        working-directory: tools/ATMACA-Gorsel-Toplayici
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ATMACA-Gorsel-Toplayici-APK
          path: tools/ATMACA-Gorsel-Toplayici/app/build/outputs/apk/debug/app-debug.apk
