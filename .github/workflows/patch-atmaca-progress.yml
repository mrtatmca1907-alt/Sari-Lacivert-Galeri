name: Patch ATMACA Cloud Progress

on:
  push:
    branches: ["atmaca-offline-sync-impl"]
    paths:
      - ".github/workflows/patch-atmaca-progress.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atmaca-offline-sync-impl
      - name: Patch cloud backup progress UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("ATMACA-WIFI/app/src/main/java/com/atmaca/files/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          lines = [
              "    private void backupFolderToCloud(Uri source, Uri dest) {",
              "        status.setText(\"Bulut yedeği taranıyor...\");",
              "        io.execute(() -> {",
              "            try {",
              "                final int[] totalSeen = {0};",
              "                int count = SafTreeCopier.copyTree(this, source, dest, (done, total, currentName) -> {",
              "                    totalSeen[0] = total;",
              "                    runOnUiThread(() -> status.setText(BackupProgress.text(done, total, currentName)));",
              "                });",
              "                int total = totalSeen[0] == 0 ? count : totalSeen[0];",
              "                backupSourceTree = null;",
              "                runOnUiThread(() -> {",
              "                    status.setText(BackupProgress.completed(count, total));",
              "                    toast(\"Klasör ve alt klasörler Bulut'a yedeklendi\");",
              "                });",
              "            } catch (Exception e) {",
              "                runOnUiThread(() -> {",
              "                    status.setText(\"Bulut yedekleme hatası: \" + safe(e.getMessage()));",
              "                    toast(\"Klasör yedekleme tamamlanamadı\");",
              "                });",
              "            }",
              "        });",
              "    }",
              "",
              ""
          ]
          replacement = "\n".join(lines)
          pattern = r"    private void backupFolderToCloud\(Uri source, Uri dest\) \{\n.*?\n    \}\n\n(?=    private void copyCloudFilesToPhone)"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"backupFolderToCloud patch failed: {n}")
          p.write_text(s2, encoding="utf-8")
      - name: Commit progress UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ATMACA-WIFI/app/src/main/java/com/atmaca/files/MainActivity.java
          git commit -m "feat: show live cloud backup progress"
          git push origin HEAD:atmaca-offline-sync-impl
