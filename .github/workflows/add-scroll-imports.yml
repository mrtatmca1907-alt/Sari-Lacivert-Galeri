name: Add Scroll Imports

on:
  push:
    branches: [ atmaca-native-core ]
    paths:
      - 'coreapp/add_scroll_imports.py'
      - '.github/workflows/add-scroll-imports.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: atmaca-native-core
      - name: Add imports
        run: python3 coreapp/add_scroll_imports.py
      - name: Commit imports
        run: |
          git config user.name "atmaca-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add coreapp/src/main/kotlin/com/atmaca/gallery/GalleryApp.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: import Compose horizontal scroll helpers"
          git push origin HEAD:atmaca-native-core
