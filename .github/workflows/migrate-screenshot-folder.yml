name: Migrate screenshot folder

on:
  push:
    branches: [atmaca-native-core]
    paths:
      - 'coreapp/migrate_screenshot_folder.py'
      - '.github/workflows/migrate-screenshot-folder.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: atmaca-native-core
          fetch-depth: 0
      - name: Apply screenshot folder migration
        run: python3 coreapp/migrate_screenshot_folder.py
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coreapp/src/main/kotlin/com/atmaca/gallery/GalleryApp.kt
          git commit -m "feat: add selectable screenshot output folder"
          git push origin HEAD:atmaca-native-core
