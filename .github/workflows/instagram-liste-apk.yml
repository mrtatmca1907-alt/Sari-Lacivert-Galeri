name: Instagram Liste APK
on:
  push:
    branches: [ instagram-liste-apk ]
    paths:
      - 'InstagramListe/**'
      - '.github/workflows/instagram-liste-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          ref: instagram-liste-apk
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK ve platformu hazırla
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK derle
        working-directory: InstagramListe
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-Liste-APK
          path: InstagramListe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
