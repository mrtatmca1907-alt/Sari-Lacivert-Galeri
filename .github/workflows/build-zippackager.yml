name: Build ATMACA ZIP Paketleyici

on:
  push:
    branches:
      - feature/zip-packager
    paths:
      - 'zippackager/**'
      - '.github/workflows/build-zippackager.yml'
  workflow_dispatch:

concurrency:
  group: zip-packager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: API 35 hazirla
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Gradle 8.10.2 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test ve APK derle
        working-directory: zippackager
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: APK ve SHA256 hazirla
        run: |
          cp zippackager/app/build/outputs/apk/debug/app-debug.apk zippackager/ATMACA-ZIP-Paketleyici-1.1.apk
          sha256sum zippackager/ATMACA-ZIP-Paketleyici-1.1.apk > zippackager/ATMACA-ZIP-Paketleyici-1.1.apk.sha256

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: ATMACA-ZIP-Paketleyici-1.1
          path: |
            zippackager/ATMACA-ZIP-Paketleyici-1.1.apk
            zippackager/ATMACA-ZIP-Paketleyici-1.1.apk.sha256
          if-no-files-found: error
          retention-days: 30
