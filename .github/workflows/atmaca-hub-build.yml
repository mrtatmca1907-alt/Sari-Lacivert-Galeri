name: Build ATMACA Hub

on:
  push:
    branches: [ atmaca-hub-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract source
        run: |
          rm -rf atmaca-build
          mkdir atmaca-build
          unzip -q atmaca-hub-source.zip -d atmaca-build
      - name: Test and build
        working-directory: atmaca-build
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ATMACA-APK
          path: atmaca-build/app/build/outputs/apk/debug/app-debug.apk
