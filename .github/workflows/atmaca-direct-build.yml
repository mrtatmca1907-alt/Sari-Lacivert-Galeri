name: Build ATMACA Direct

on:
  push:
    branches: [ atmaca-direct-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: atmaca-direct
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ATMACA-APK
          path: atmaca-direct/app/build/outputs/apk/debug/app-debug.apk
