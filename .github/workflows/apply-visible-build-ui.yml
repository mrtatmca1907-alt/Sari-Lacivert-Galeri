name: Apply Visible Build UI

on:
  push:
    branches: [ atmaca-native-core ]
    paths:
      - 'coreapp/apply_visible_build_ui.py'
      - '.github/workflows/apply-visible-build-ui.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: atmaca-native-core
      - name: Apply visible build UI
        run: python3 coreapp/apply_visible_build_ui.py
      - name: Commit UI change
        run: |
          git config user.name "atmaca-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add coreapp/src/main/kotlin/com/atmaca/gallery/GalleryApp.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: show build badge and prevent selection text wrapping"
          git push origin HEAD:atmaca-native-core
