name: Build Gallery Ultimate

on:
  push:
    branches: [ gallery-ultimate-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Prepare launcher icon
        run: |
          base64 -d app/src/main/res/drawable/atmaca_icon.webp.b64 > app/src/main/res/drawable/atmaca_icon.webp
          test -s app/src/main/res/drawable/atmaca_icon.webp
          rm app/src/main/res/drawable/atmaca_icon.webp.b64

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply Ultimate v1 base patches
        run: python3 scripts/ultimate_gallery_patch.py
      - name: Apply Ultimate v2 fixes
        run: python3 scripts/ultimate_v2_patch.py
      - name: Test
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Galeri-Ultimate-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
