name: Migrate stability perf

on:
  push:
    branches: [atmaca-native-core]
    paths:
      - 'coreapp/migrate_stability_perf.py'
      - '.github/workflows/migrate-stability-perf.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: atmaca-native-core
          fetch-depth: 0
      - name: Apply stability performance migration
        run: python3 coreapp/migrate_stability_perf.py
      - name: Commit migrated Kotlin source
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coreapp/src/main/kotlin/com/atmaca/gallery/GalleryApp.kt \
                  coreapp/src/main/kotlin/com/atmaca/gallery/CompleteSettingsExtras.kt \
                  coreapp/src/main/kotlin/com/atmaca/gallery/CompleteToolEngine.kt
          git commit -m "fix: stabilize albums camera tools and frame progress"
          git push origin HEAD:atmaca-native-core
